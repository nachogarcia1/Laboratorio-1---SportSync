# Perfil de TESTS (@ActiveProfiles("test")). Valores solo para la base local de tests
# y no se usan fuera de ellos. T-18 los reemplaza por Testcontainers.
sportsync.jwt.secret=test-secret-solo-para-tests-0123456789-abcdef
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/sport_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
