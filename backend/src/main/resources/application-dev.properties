# Perfil de DESARROLLO LOCAL. Se activa con: spring.profiles.active=dev
# (en backend/.env, o con SPRING_PROFILES_ACTIVE=dev en el entorno).
# NUNCA lo actives en un servidor compartido o de producción.

# Secreto JWT de prueba: permite arrancar sin configurar JWT_SECRET. No sirve para producción.
sportsync.jwt.secret=${JWT_SECRET:dev-only-secret-no-usar-en-produccion-0123456789}

# Si no hay SMTP configurado, el código de verificación se imprime en la consola del backend.
sportsync.verificacion.modo-dev-log=${VERIF_DEV_LOG:true}
